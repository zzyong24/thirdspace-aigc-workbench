name: Validate workbench
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --index-url https://pypi.org/simple -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python projects/render_records.py projects/demo-rooftop --check
      - run: python queue/automation.py doctor
      - run: python queue/automation.py run --execute
      - run: python queue/automation.py run --execute
      - run: python queue/build_board.py
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix queue/board-ui
      - run: npm run build --prefix queue/board-ui
      - run: npm exec --prefix queue/board-ui -- antd lint queue/board-ui/src/main.jsx --format json
