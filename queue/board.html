  <script id="board-data" type="application/json">{"timezone": "Asia/Shanghai", "updated": "2026-10-04T22:21+08:00", "automation_status": "disabled", "automation_id": null, "execution_policy": {"model": "MiniMax H3 RH Enhanced", "allow_existing_runninghub_points_at_21_00": false, "point_budget_per_run": 0, "require_balance_check_before_every_submission": true, "may_spend_rmb_wallet_or_purchase_topups": false, "concurrency": "verify_in_live_ui_each_run"}, "credit_start": "21:00", "git": {"enabled": false, "head": "", "branch": "", "commits": []}, "workspace_documents": [{"path": "queue/README.md", "name": "README.md", "title": "队列说明", "category": "工作区规范", "bytes": 1699, "modified": "2026-10-04T22:09+08:00", "version": "", "key": "queue/README.md", "exists": true, "content": "# 制作队列与工作台\n\n安装根目录 requirements.txt 后，运行 `python3 queue/serve_board.py`，打开 <http://127.0.0.1:8767/queue/board.html>。`--port` 可换端口；Ctrl+C 停止。静态页面与本地素材同源，便于阅读文档和预览。\n\n工作台显示构建时快照，包含作品总览、进度、资料、素材、镜头引用、提示词和文件台账；它不会自行执行任务、监控浏览器或创建 Codex 自动化。顶栏显示的是配置记录，无法证明任何定时器真实在运行。\n\n- `index.yaml`：时区、积分通道时间、模型、预算与执行策略。\n- `anytime.yaml`：输入/依赖就绪后可准备的任务；外部新增费用仍需授权。\n- `points-21.yaml`：需要积分的任务；名称保留兼容，实际时间以 index.yaml 为准。\n\n新安装默认不授权积分、不配置自动化，模型、价格、免费窗口和并发必须在 RunningHub 现场核实。配置允许积分只是偏好，不代替当前用户授权。调度器由使用者单独配置；本仓库不安装任何定时任务。\n\n状态：`intake → preparing → ready → running → review → editing → exporting_to_canvas → done`。受阻时使用 `waiting_input`、`waiting_dependency`、`waiting_browser`、`waiting_balance` 或 `retry_needed`。已经完成的返工任务不应再计入待返工数。\n\n修改 YAML 后先渲染项目文档，再执行 `python3 queue/build_board.py`，刷新浏览器。仅 Markdown 的旧项目支持原有固定章节/表格；新项目使用 docs/records.md 中的版本化记录。修改界面时进入 `queue/board-ui/` 执行 `npm ci` 和 `npm run build`，然后重新生成页面。\n"}, {"path": "projects/AGENTS.md", "name": "AGENTS.md", "title": "作品目录规范", "category": "工作区规范", "bytes": 2818, "modified": "2026-10-04T22:09+08:00", "version": "", "key": "projects/AGENTS.md", "exists": true, "content": "# 项目制作规范\n\n每个作品使用独立 `projects/<slug>/` 目录；根目录 `project.yaml` 记录作品名、阶段、画幅、时长与交付方式。创建：`python3 projects/new_project.py <slug> --title <title>`。\n\n## 文件与记录\n\n- `proposal.md`：创意、目标观众、规格和待确认项。\n- `research.md`：事实来源、解读与创作选择分开。\n- `script.md`：旁白、对白、声音和字幕设计。\n- `project_assets.md`：素材来源、许可、缺项与交付物。\n- `assets/asset-matrix.yaml`：版本为 1，登记人物、场景、道具、镜头覆盖、图像与上传状态。\n- `prompts/shots.yaml`：版本为 1，逐镜动作、时长、参考资产、摄影调度和生成参数。\n- `shot_audit.yaml`：版本为 1，逐镜提交/生成/审片状态；运行细节记入 `run-log.md`。\n- `assets/audio/source.yaml`：音源文件、来源与授权状态。没有音源就记缺失，不能把流媒体链接当音频文件。\n\nYAML 是结构化项目的唯一维护源。`assets/asset-matrix.md`、`prompts/shot-prompts.md`、`storyboard.md` 和 `shot_audit.md` 由 `python3 projects/render_records.py projects/<slug>` 生成；直接编辑生成页会在下次渲染时被覆盖。旧的仅 Markdown 项目仍可被工作台读取；新项目采用 YAML。\n\n## 素材与摄影调度\n\n人物、场景、道具分别存放在 `assets/characters/`、`assets/scenes/`、`assets/props/`；图像提示词在 `prompts/assets/`。生成前完成全部适用的正面、侧面、背面三视图，核验人物身份与空间布局。示例 SVG 为教学示意，真实任务需制作和检查完整参考图。\n\n每镜写全 camera 的 `start`（起始景别、机位、轴线）、`move`（带时间段的方向、速度、幅度）、`stop`（停点、末帧构图、何时稳定）、`continuity`（出入画、视线轴、下一镜承接）。用实际场景三视图检查路径，生成后检查首/中/尾帧。技术校验不能替代画面审查。\n\n## 运行与交付\n\n每个作品一张 RunningHub 画布，一个 Ego Lite TaskSpace；参考图在左、编号镜头在右，卡片和连线清晰。节点提交前核对模型、模式、引用、参数、当前费用与余额；积分需当前用户明确授权，不因队列配置为 true 自动获得授权，不使用现金或充值。\n\n提交前执行 `python3 projects/render_records.py projects/<slug> --check --ready`，再进行现场核验；本地校验通过不证明已上传、当前价格或生成质量。缺项时只暂停受影响任务并写明原因。\n\n在线编辑核对来源、顺序、裁切、间隙、画幅和总长；画布出现可播放成品后才能标记完成。下载镜头放 `generated/shots/`，成片与工程放 `exports/`。运行记录改变后重建工作台。\n"}, {"path": "projects/FILE_RULES.md", "name": "FILE_RULES.md", "title": "文件命名与存放规则", "category": "工作区规范", "bytes": 1644, "modified": "2026-10-04T22:09+08:00", "version": "", "key": "projects/FILE_RULES.md", "exists": true, "content": "# 文件、版本与结构化记录\n\n项目 ID 使用英文小写、数字和连字符，并和目录名一致。人物为 C01、场景为 S01、道具为 P01；同一身份/场景/物件保留 ID，内容改变保留旧文件并递增 `v01`、`v02`。资产矩阵只登记该 ID 当前版本；历史文件与采用依据保存在项目目录和日志中。\n\n| 内容 | 位置与命名 |\n|---|---|\n| 人物图 | `assets/characters/C01-robot-turnaround-v01.png` |\n| 场景图 | `assets/scenes/S01-rooftop-turnaround-v01.png` |\n| 道具图 | `assets/props/P01-light-turnaround-v01.png` |\n| 资产图提示词 | `prompts/assets/C01-robot.md` |\n| 视频提示词维护源 | `prompts/shots.yaml` |\n| 镜头视频 | `generated/shots/shot-01-rooftop-v01.mp4` |\n| 音源及许可 | `assets/audio/` 与 `source.yaml` |\n| 成片/工程 | `exports/<slug>-master-v01.mp4` |\n\n资产矩阵的 image 相对 `assets/`；prompt_file 和审片记录的 video 相对项目根目录。绝对路径和越出项目的路径会被校验器拒绝。示例提供 SVG，真实图像可使用 PNG/JPEG/WebP 等浏览器支持格式。\n\n结构示例见 `projects/demo-rooftop/`，详细字段见 `docs/records.md`。三个 YAML 文件使用 `version: 1`；唯一镜号使用正整数，重复 ID、未知参考资产、未知镜头、非正数时长或不支持的版本会导致构建失败，避免悄悄生成错误看板。\n\n代码、文档和示例小图使用普通 Git。本仓库没有强制 Git LFS；自己的大图片、音视频可按需安装 LFS 并配置 `.gitattributes`。不要公开私人项目和运行日志。工作台不下载 RunningHub 视频。\n"}, {"path": ".agents/skills/runninghub-minimax-story-video/SKILL.md", "name": "SKILL.md", "title": "RunningHub 视频操作 Skill", "category": "工作区规范", "bytes": 5466, "modified": "2026-10-04T22:09+08:00", "version": "", "key": ".agents/skills/runninghub-minimax-story-video/SKILL.md", "exists": true, "content": "# RunningHub 故事视频\n\n输入故事/剧本、目标时长、画幅、风格和可用参考图；输出逐镜提示词、参考资产、画布与节点记录、生成和审片结果。采用当前 UI 中可用的 MiniMax 工作流；`MiniMax H3 RH Enhanced` / `全能参考` 是已观察的组合，名称和可用性必须现场核实。\n\n## 依赖与状态归属\n\n- 需要支持 Skill 的代理环境、单独安装的 `ego-browser` Skill/Ego Lite，以及使用者自己的 RunningHub 登录。按激活名称查找浏览器 Skill，不假定其与本 Skill 相邻。不使用 RunningHub 私有 API 绕过页面。\n- 单独安装可在用户指定的项目目录维护记录，格式见 [记录模板](references/records.md)。与本仓库一起使用时遵循工作区 `AGENTS.md`、`projects/AGENTS.md`，由 `projects/new_project.py` 建项目；队列和工作台是可选集成。\n- 创作、资产与运行状态归作品目录；可复用规则归 Skill。保留旧版本和原任务身份，不能把安装 Skill 视为付款或发布授权。\n\n## 流程\n\n1. 确认故事、时长、画幅、参考图与交付方式；能合理推断的普通规格不反复询问。用户只要方案时完成方案，不打开生成任务。\n2. 先研究事实与含混意象，把事实来源、解读和创作选择分开。写故事结构、剧本和有闭合时间轴的分镜；每镜以一个主要动作承担叙事。\n3. 盘点全部人物、场景和独立道具。每项适用参考图完成正面、侧面、背面三视图，检查同一身份、造型、尺寸、光向与空间布局。图像生成工具由使用者选定；图像上传节点不等于图像生成工具。\n4. 写逐镜提示词和下面的完整摄影调度；引用当前精确文件名/资产版本。与真实场景三视图对照，路径矛盾时先改参考图。\n5. 每个作品一个 Ego Lite TaskSpace、一张 RunningHub 画布，全部镜头共用该画布。参考图放左，编号镜头按序放右，卡片间距充分、连线不穿卡片。多作品仅在用户或工作区允许独立浏览器时分别处理；不能绕过已交还用户的控制权。\n6. 阅读 [操作经验](references/runninghub-operations.md)。逐节点确认账号、模型、模式、引用、时长、画幅、分辨率与费用。先看已有任务再提交，不能把慢响应当失败重复生成。\n7. 记录节点身份、提示词/参考版本、报价和运行结果。逐镜检查首/中/尾帧与运动停点；不通过时先诊断再返工。生成成功不等于审片通过。\n8. 在线交付保留视频在画布；只有用户要求本地文件才下载到其项目。剪辑前核对来源、顺序、裁切、间隙、画幅和总时长。记录草稿与导出状态，直到输出节点实际可播放才标为完成。\n\n## 摄影调度门槛\n\n每镜在分镜和提交提示词中写全：\n\n- **start**：起始景别、机位方位/高度、观看轴线、主体位置与首个动作。\n- **move**：锁定、推拉、横移、摇、俯仰、环绕等；写方向、速度/幅度与时间段。多段明确切点。\n- **stop**：停在哪个动作或空间标记、何时稳定、最终景别/构图与必须留下的内容。\n- **continuity**：出入画、视线轴和下一镜承接；运动在所选时长与真实场景空间内可执行。\n\n“电影感运镜”不算摄影计划。模型忽略运动或末帧构图时应记返工，不用“氛围很好”替代目标验证。本地 --ready 校验检查记录完整性，不能证明画面质量、现场上传或付款授权。\n\n## 费用、队列与恢复\n\n- 默认没有积分授权。免费/明确零费用任务在依赖就绪后可执行；积分任务需当前用户明确授权平台、预算与时间，并逐节点核对现价和余额。配置 true、历史授权或旧报价不能自行授权新的使用者。\n- 不消费现金钱包，不购买/充值积分。费用类型不清、余额不足或超预算时暂停该项并写原因，不重复询问已经在当前上下文明确提供的授权。\n- 可选队列使用用户配置的时区和窗口；默认 Asia/Shanghai、21:00 只是样例。YAML 不会自动创建定时器，也不会唤醒设备或浏览器。\n- 登录、验证码、权限提示交还用户在原空间处理。用户接管后停止；经用户明确恢复才继续同一空间。原空间无法恢复时记录 waiting_browser，不另开空间逃避交接。\n- 超时只说明观察结束；先检查原任务身份与在线状态，再决定是否重试。恢复保留成功镜头，只处理失败或拒绝项。每次返工重新核价。\n\n## 验证与限制\n\n画布节点和浏览器 UI 会变；当前费用、免费活动、模型和并发以现场为准。浏览器流程依赖代理宿主和 Ego Lite，本 Skill 不自带执行器或长期登录。发布版的教学项目没有在 RunningHub 提交任务；示例图不代表模型效果。\n\n构图/连续性可参考 [跨模型改写](references/awesome-seedance-adaptation.md)，不能把 Seedance 专有语法或模型能力直接当 MiniMax 规格。\n"}, {"path": ".agents/skills/runninghub-minimax-story-video/references/runninghub-operations.md", "name": "runninghub-operations.md", "title": "RunningHub 操作经验与故障处理", "category": "工作区规范", "bytes": 3227, "modified": "2026-10-04T22:09+08:00", "version": "", "key": ".agents/skills/runninghub-minimax-story-video/references/runninghub-operations.md", "exists": true, "content": "# RunningHub 可复用操作经验\n\n这些是历史 UI 观察的归纳；不保证当前界面相同，不携带任何使用者账号或私人任务。先读已安装的 ego-browser Skill，再访问 <https://rhtv.runninghub.cn/projects/canvas/me>。\n\n## 模型、模式与费用\n\n新视频节点可能恢复为其他模型/文生视频模式。添加或引用参考图后也必须重新核验模型与参考模式；选了全能参考不证明选中了 MiniMax。级联模型菜单在切供应商或过滤后会重绘，旧元素引用可能失效；重新观察精确选项。\n\n配置面板被画布缩放裁掉时，看不见的报价不能当作免费。调整缩放，让参数、费用和生成按钮同时可见；不要固定某个历史缩放百分比。活动窗口、免费资格、并发数和计费类型均从当前节点读取；不沿用历史优惠或余额。\n\n## 画布布局与编辑\n\n添加节点可能叠在同一位置。拖动标题条到规划的网格位置，再检查连线与卡片留白。选中节点的浮动编辑器可挡住其他节点；观察后选可见标题区域，不盲点中心。整理画布只作为起点，仍需人工检查布局。\n\n“视频重拍”可能新建重拍节点，不是原提示词编辑器。发生意外节点时先确认未提交，返回原节点；删除只有明确属于此次误建、无有用结果的临时节点才可进行。\n\n## 画面与摄影调度\n\n多角色、玻璃反射与景深可造成脸部混合。明确角色位置、年龄、身份和镜头切点；反应特写可用干净背景减少重叠。一般“无文字”约束可能仍生成伪字；对不需要可读文字的作品明确排除海报、招牌、贴纸等，精确文字可后期制作。\n\n负面约束不能保证没有变形。生成后的末段也要检查；静态首帧不能证明整段通过。多人物/多婴儿等数量要求要逐镜核对。没有可辨视差的横移不能记为摄影调度通过；若改成锁定机位，应同步修改分镜与提示词并记录新的创作选择。\n\n## 播放与审片\n\n画布 DOM 可能仍挂载之前的离屏视频。核对选中节点名、实际视频来源和可见区域；等待 readyState 可播放后再采样，seek 后等待 seeked。多个采样完全一样先排查过期播放器与未更新播放头，不能立刻判断模型输出静止。\n\n拥挤画布截图可能超时。优先隔离所选播放器、减少可见预览；需要画帧时仍须确认来源与播放位置。若跨域阻止截图，记录无法验证，不绕过网站权限。只看首/中/尾帧不证明听过全段声音；对白需试听清晰度、口型和节奏。\n\n## 在线剪辑与导出\n\n草稿、可播放预览和完成导出是不同状态。先核对每段名称、来源、顺序、裁切、间隙、画幅和总长，保存草稿再进行有界恢复。导出卡住时记录进度与错误，检查原任务和登录；不要反复重建整条时间线或购买积分尝试解决浏览器编码问题。\n\n在线交付选择导出到画布；直到新输出节点可播放才能记 done。浏览器/GPU 重启、清理账号数据或替换空间不是默认恢复步骤；登录失效先由用户在原空间处理。\n"}], "projects": [{"kind": "project", "title": "屋顶的第一束光（原创教学示例）", "path": "projects/demo-rooftop", "canvas": "", "stage": "前期准备", "shot_count": 3, "generated": 0, "expected_shots": 3, "passed": 0, "redo": 0, "shots": [{"number": 1, "duration": "5 秒", "state": "planned", "verdict": "未提交", "notes": "教学示例；尚未提交 RunningHub，未生成视频或审片。"}, {"number": 2, "duration": "5 秒", "state": "planned", "verdict": "未提交", "notes": "教学示例；尚未提交 RunningHub，未生成视频或审片。"}, {"number": 3, "duration": "5 秒", "state": "planned", "verdict": "未提交", "notes": "教学示例；尚未提交 RunningHub，未生成视频或审片。"}], "retake_numbers": [], "assets": {"total": 3, "characters": 1, "scenes": 1, "props": 1, "canvas_nodes": 0, "uploaded": 0}, "asset_items": [{"id": "C01", "name": "小灯机器人", "category": "人物", "shots": "01、02、03", "status": "示例 / 草稿；未上传", "historical": false, "uploaded": false, "image_name": "characters/C01-robot-turnaround-v01.svg", "image": "projects/demo-rooftop/assets/characters/C01-robot-turnaround-v01.svg", "prompt_file": "projects/demo-rooftop/prompts/assets/C01-robot.md"}, {"id": "S01", "name": "清晨屋顶", "category": "场景", "shots": "01、02、03", "status": "示例 / 草稿；未上传", "historical": false, "uploaded": false, "image_name": "scenes/S01-rooftop-turnaround-v01.svg", "image": "projects/demo-rooftop/assets/scenes/S01-rooftop-turnaround-v01.svg", "prompt_file": "projects/demo-rooftop/prompts/assets/S01-rooftop.m 01"]}, {"number": 3, "title": "第一束光", "text": "机器人举起打开的小盒，看向远处日出，盒内柔光与晨光呼应，形成安静的结尾。保持角色、盒子、栏杆位置和光照方向，不产生文字。\n\n摄影调度\nstart: 中近景，同一轴线，机器人正面偏侧，盒子在画面下部。\nmove: 0–2秒缓慢上仰，由盒子移动至脸和天际线，不旋转越轴。\nstop: 2–5秒锁定，机器人双眼、举起的盒子和日出都留在末帧。\ncontinuity: 结尾停稳，可淡出；不添加突然运动或新角色。", "references": ["C01-robot-turnaround-v01.svg", "S01-rooftop-turnaround-v01.svg", "P01-light-turnaround-v01.svg"], "reference_details": [{"name": "C01-robot-turnaround-v01.svg", "asset_id": "C01", "image": "projects/demo-rooftop/assets/characters/C01-robot-turnaround-v01.svg"}, {"name": "S01-rooftop-turnaround-v01.svg", "asset_id": "S01", "image": "projects/demo-rooftop/assets/scenes/S01-rooftop-turnaround-v01.svg"}, {"name": "P01-light-turnaround-v01.svg", "asset_id": "P01", "image": "projects/demo-rooftop/assets/props/P01-light-turnaround-v01.svg"}], "reference_asset_ids": ["C01", "S01", "P01"], "planned_asset_ids": ["C01", "S01", "P01"]}], "audio": {"source": null, "file_status": "not_required", "license_status": "not_applicable", "notes": "示例无音源，不代表成片已有配乐"}, "anytime": [{"project": "projects/demo-rooftop", "title": "屋顶的第一束光（原创教学示例）", "task": "prepare_references", "state": "preparing", "depends_on": "用正式三视图替换示意图，人工审查并上传自己的画布"}], "points_21": [], "final_waiting": false, "documents": {"AGENTS.md": true, "research.md": true, "script.md": true, "storyboard.md": true, "prompts/shot-prompts.md": true, "shot_audit.md": true}, "document_items": [{"key": "project.yaml", "title": "作品元信息", "category": "规范", "exists": true, "content": "id: demo-rooftop\ntitle: 屋顶的第一束光（原创教学示例）\nkind: video\nstatus: preparing\naspect_ratio: '9:16'\ntarget_duration_seconds: 15\ndelivery_mode: undecided\ncanvas_url: null\nexample: true\n", "path": "projects/demo-rooftop/project.yaml", "name": "project.yaml", "bytes": 205, "modified": "2026-10-04T22:11+08:00", "version": ""}, {"key": "AGENTS.md", "title": "项目说明", "category": "规范", "exists": true, "content": "# 屋顶的第一束光 · 教学项目\n\n遵循上级规范。所有素材为原创教学示意，无真实人物或私人账号。没有提交RunningHub任务，没有视频结果；保留所有镜头为planned。\n\n修改版本化YAML，使用render_records.py更新阅读页；将正式参考图检查并上传后才进行ready校验与现场核验。\n", "path": "projects/demo-rooftop/AGENTS.md", "name": "AGENTS.md", "bytes": 354, "modified": "2026-10-04T22:11+08:00", "version": ""}, {"key": "proposal.md", "title": "创意方案", "category": "策划", "exists": true, "content": "# 创意方案\n\n用一个机器人、一个屋顶和一个光盒演示15秒三镜故事。主题是发现、打开、分享微光。竖屏9:16，色调薄荷绿和暖橙。\n\n示例包含原创向量参考图与完整摄影调度；参考图未上传，视频未生成，不可直接标为ready。\n", "path": "projects/demo-rooftop/proposal.md", "name": "proposal.md", "bytes": 297, "modified": "2026-10-04T22:11+08:00", "version": ""}, {"key": "research.md", "title": "研究资料", "category": "策划", "exists": true, "content": "# 研究记录\n\n本示例为原创虚构，不依赖真实人物、歌曲或第三方素材。场景三视图是空间规划示意，真实生成前需进一步核验可执行的机位和运动路径。\n", "path": "projects/demo-rooftop/research.md", "name": "research.md", "bytes": 203, "modified": "2026-10-04T22:11+08:00", "version": ""}, {"key": "script.md", "title": "剧本", "category": "创作", "exists": true, "content": "# 屋顶的第一束光 · 剧本\n\n原创教学示例，15秒，无对白、无外部音乐。\n\n0–5秒：机器人走到屋顶中央。5–10秒：托起盒子并打开。10–15秒：举起柔光，看向日出，停稳结束。\n\n没有提交真实视频任务；三个镜头均为未提交。\n", "path": "projects/demo-rooftop/script.md", "name": "script.md", "bytes": 297, "modified": "2026-10-04T22:11+08:00", "version": ""}, {"key": "storyboard.md", "title": "分镜脚本", "category": "创作", "exists": true, "content": "# 分镜脚本\n\n> 由 shots.yaml 生成；动作与完整摄影调度以 YAML 为准。\n\n### 01 · 找到光\n\n时长：5 秒\n\n参考：C01、S01\n\n9:16 竖屏。小灯机器人独自在清晨屋顶，从左侧缓慢走向屋顶中央。保持机器人薄荷绿外壳和双圆眼，同一屋顶栏杆、晨光方向；画面不出现文字或品牌。\n\n- **start**：全景，机位在屋顶南侧，高约1.2米，朝北，机器人位于左下。\n- **move**：0–3秒缓慢向右横移约半个角色身宽，跟随机器人，保持栏杆在背景。\n- **stop**：3–5秒机位停止，机器人到画面中央，保持全身和屋顶轮廓。\n- **continuity**：角色保持向右行进；下一镜同轴向下切到盒子，不跨轴。\n\n### 02 · 打开盒子\n\n时长：5 秒\n\n参考：C01、S01、P01\n\n小灯机器人在屋顶中央停下，双手托起无品牌小盒，缓慢打开，露出温暖柔光。只出现一个机器人和一个盒子，动作简单，保持参考图身份与布局。\n\n- **start**：中景，同一南侧机位高1.2米，机器人居中，盒子位于胸前。\n- **move**：0–3秒缓慢推近，配合打开盒子，避免环绕和复杂手部动作。\n- **stop**：3–5秒停在胸部近景，双手、开盒状态和柔光同时清晰可见。\n- **continuity**：视线朝盒子下方；下一镜仍从南侧，向上切到面部和日出。\n\n### 03 · 第一束光\n\n时长：5 秒\n\n参考：C01、S01、P01\n\n机器人举起打开的小盒，看向远处日出，盒内柔光与晨光呼应，形成安静的结尾。保持角色、盒子、栏杆位置和光照方向，不产生文字。\n\n- **start**：中近景，同一轴线，机器人正面偏侧，盒子在画面下部。\n- **move**：0–2秒缓慢上仰，由盒子移动至脸和天际线，不旋转越轴。\n- **stop**：2–5秒锁定，机器人双眼、举起的盒子和日出都留在末帧。\n- **continuity**：结尾停稳，可淡出；不添加突然运动或新角色。\n\n", "path": "projects/demo-rooftop/storyboard.md", "name": "storyboard.md", "bytes": 1990, "modified": "2026-10-04T22:17+08:00", "version": ""}, {"key": "project_assets.md", "title": "项目资产索引", "category": "资产", "exists": true, "content": "# 项目资产索引\n\nC01机器人、S01屋顶、P01光盒均为本仓库原创SVG，按MIT许可发布。当前仅教学示例；未上传RunningHub，无画布、浏览器身份或外部音源。\n\n交付范围：项目模板、三镜提示词、摄影调度与引用关系；没有视频成片。\n", "path": "projects/demo-rooftop/project_assets.md", "name": "project_assets.md", "bytes": 299, "modified": "2026-10-04T22:11+08:00", "version": ""}, {"key": "assets/asset-matrix.md", "title": "三视图资产矩阵", "category": "资产", "exists": true, "content": "# 资产矩阵\n\n> 由 asset-matrix.yaml 生成；修改 YAML 后重新渲染。草稿图片不表示已上传或可提交。\n\n| ID | 类型 | 名称 | 镜头 | 三视图文件 | 状态 |\n|---|---|---|---|---|---|\n| C01 | 人物 | 小灯机器人 | [1, 2, 3] | characters/C01-robot-turnaround-v01.svg | draft |\n| S01 | 场景 | 清晨屋顶 | [1, 2, 3] | scenes/S01-rooftop-turnaround-v01.svg | draft |\n| P01 | 道具 | 无文字发光盒 | [2, 3] | props/P01-light-turnaround-v01.svg | draft |\n", "path": "projects/demo-rooftop/assets/asset-matrix.md", "name": "asset-matrix.md", "bytes": 494, "modified": "2026-10-04T22:17+08:00", "version": ""}, {"key": "prompts/shot-prompts.md", "title": "逐镜生成计划与提示词", "category": "生成", "exists": true, "content": "# 逐镜提示词\n\n> 由 shots.yaml 生成；修改 YAML 后重新渲染。\n\n### 01 · 找到光\n\n时长：5 秒\n\n参考：C01、S01\n\n9:16 竖屏。小灯机器人独自在清晨屋顶，从左侧缓慢走向屋顶中央。保持机器人薄荷绿外壳和双圆眼，同一屋顶栏杆、晨光方向；画面不出现文字或品牌。\n\n- **start**：全景，机位在屋顶南侧，高约1.2米，朝北，机器人位于左下。\n- **move**：0–3秒缓慢向右横移约半个角色身宽，跟随机器人，保持栏杆在背景。\n- **stop**：3–5秒机位停止，机器人到画面中央，保持全身和屋顶轮廓。\n- **continuity**：角色保持向右行进；下一镜同轴向下切到盒子，不跨轴。\n\n参数：`{'model': 'MiniMax H3 RH Enhanced', 'mode': '全能参考', 'aspect_ratio': '9:16', 'resolution': '以当前 UI 为准'}`\n\n### 02 · 打开盒子\n\n时长：5 秒\n\n参考：C01、S01、P01\n\n小灯机器人在屋顶中央停下，双手托起无品牌小盒，缓慢打开，露出温暖柔光。只出现一个机器人和一个盒子，动作简单，保持参考图身份与布局。\n\n- **start**：中景，同一南侧机位高1.2米，机器人居中，盒子位于胸前。\n- **move**：0–3秒缓慢推近，配合打开盒子，避免环绕和复杂手部动作。\n- **stop**：3–5秒停在胸部近景，双手、开盒状态和柔光同时清晰可见。\n- **continuity**：视线朝盒子下方；下一镜仍从南侧，向上切到面部和日出。\n\n参数：`{'model': 'MiniMax H3 RH Enhanced', 'mode': '全能参考', 'aspect_ratio': '9:16', 'resolution': '以当前 UI 为准'}`\n\n### 03 · 第一束光\n\n时长：5 秒\n\n参考：C01、S01、P01\n\n机器人举起打开的小盒，看向远处日出，盒内柔光与晨光呼应，形成安静的结尾。保持角色、盒子、栏杆位置和光照方向，不产生文字。\n\n- **start**：中近景，同一轴线，机器人正面偏侧，盒子在画面下部。\n- **move**：0–2秒缓慢上仰，由盒子移动至脸和天际线，不旋转越轴。\n- **stop**：2–5秒锁定，机器人双眼、举起的盒子和日出都留在末帧。\n- **continuity**：结尾停稳，可淡出；不添加突然运动或新角色。\n\n参数：`{'model': 'MiniMax H3 RH Enhanced', 'mode': '全能参考', 'aspect_ratio': '9:16', 'resolution': '以当前 UI 为准'}`\n\n", "path": "projects/demo-rooftop/prompts/shot-prompts.md", "name": "shot-prompts.md", "bytes": 2377, "modified": "2026-10-04T22:17+08:00", "version": ""}, {"key": "shot_audit.md", "title": "逐镜审片记录", "category": "生成", "exists": true, "content": "# 审片记录\n\n> 由 shot_audit.yaml 生成。未提交镜头不能记为通过。\n\n| 镜号 | 时长 | 状态 | 备注 |\n|---|---|---|---|\n| 01 | 5 | planned | 教学示例；尚未提交 RunningHub，未生成视频或审片。 |\n| 02 | 5 | planned | 教学示例；尚未提交 RunningHub，未生成视频或审片。 |\n| 03 | 5 | planned | 教学示例；尚未提交 RunningHub，未生成视频或审片。 |\n", "path": "projects/demo-rooftop/shot_audit.md", "name": "shot_audit.md", "bytes": 417, "modified": "2026-10-04T22:17+08:00", "version": ""}, {"key": "assets/asset-matrix.yaml", "title": "资产数据（维护源）", "category": "资产", "exists": true, "content": "version: 1\nassets:\n- id: C01\n  category: character\n  name: 小灯机器人\n  shots:\n  - 1\n  - 2\n  - 3\n  image: characters/C01-robot-turnaround-v01.svg\n  prompt_file: prompts/assets/C01-robot.md\n  status: draft\n- id: S01\n  category: scene\n  name: 清晨屋顶\n  shots:\n  - 1\n  - 2\n  - 3\n  image: scenes/S01-rooftop-turnaround-v01.svg\n  prompt_file: prompts/assets/S01-rooftop.md\n  status: draft\n- id: P01\n  category: prop\n  name: 无文字发光盒\n  shots:\n  - 2\n  - 3\n  image: props/P01-light-turnaround-v01.svg\n  prompt_file: prompts/assets/P01-light.md\n  status: draft\n", "path": "projects/demo-rooftop/assets
